[package]
name = "acp_rs_plugin"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["m3talsmith <m3talsmith@gmail.com>"]
description = "Service traits and the plugin package gate for ACP Red Star"
# Same <core-repo> placeholder as the root package. The rename patch updates it.
repository = "https://github.com/m3talsmith/<core-repo>"
publish = false

[dependencies]
data-encoding = "2"
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
toml = "1.1.8"

[features]
# In-memory Host for a service crate's tests. The core binary does not enable this.
test-host = []
