[package]
name = "acp_rs_node_core"
version = "3.2.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["m3talsmith <m3talsmith@gmail.com>"]
description = "Shared identity, canonical CBOR, and sealed secrets for ACP nodes"
repository = "https://github.com/m3talsmith/acp-rs-scraper"
publish = false

[dependencies]
anyhow = "1"
argon2 = "0.5"
blake3 = "1"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
bip39 = "2.2"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
zxcvbn = "3"
data-encoding = "2"
rand = "0.8"
hpke = { version = "0.12", features = ["std", "x25519"] }
chacha20poly1305 = "0.10"

[dev-dependencies]
serde_json = "1"
