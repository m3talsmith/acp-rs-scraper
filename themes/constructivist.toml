# acp-red-star theme, format v1. See docs/USAGE.md (Themes).
version = 1
name = "constructivist"
description = "Constructivist posters after Rodchenko and Lissitzky: red, black and cream"

[dark.palette]
accent = "#e2231a"
muted = "#b8ad96"
border = "#5a5048"
on_accent = "#111111"
fg = "#efe6d2"
bg = "#111111"

[dark.styles.bold]
fg = "@accent"

[dark.styles.bar]
bold = true

[dark.styles.accent_bold]
underline = true

[dark.styles.dialog]
bg = "@bg"

[dark.styles.post_tag]
fg = "@bg"
bg = "@fg"

# Markdown in post bodies ([light] uses these too unless it sets its own)
[dark.styles.h1]
fg = "@on_accent"
bg = "@accent"
bold = true

[dark.styles.h2]
bold = true

[dark.styles.h3]
fg = "@accent"
bold = true

[dark.styles.h4]
bold = true
italic = true

[dark.styles.h5]
fg = "@muted"
bold = true

[dark.styles.h6]
fg = "@muted"
italic = true

[dark.styles.quote]
fg = "@muted"
border = "@accent"
italic = true

[dark.styles.code_block]
border = "@border"

[dark.styles.list_marker]
fg = "@accent"

[dark.styles.task]
fg = "@accent"
bold = true

[dark.styles.table]
border = "@border"

[dark.styles.table_header]
fg = "@accent"
bold = true

[dark.styles.rule]
fg = "@muted"

[dark.styles.footnote]
fg = "@muted"

[light.palette]
accent = "#c4161c"
muted = "#5c5348"
border = "#111111"
on_accent = "#efe6d2"
fg = "#111111"
bg = "#efe6d2"

[light.styles.bold]
fg = "@accent"

[light.styles.bar]
bold = true

[light.styles.accent_bold]
underline = true

[light.styles.dialog]
bg = "@bg"
