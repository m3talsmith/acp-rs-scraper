# acp-rs-scraper theme, format v1. See docs/USAGE.md (Themes).
version = 1
name = "plattenbau"
description = "East German Plattenbau: concrete greys with a red accent"

[dark.palette]
accent = "#e0443a"
muted = "#9a9c9e"
border = "#55585b"
on_accent = "#ffffff"
fg = "#d8d8d4"
bg = "#2b2d2f"

[dark.styles.card_focused]
border = "@accent"

[dark.styles.dialog]
bg = "@bg"

# Markdown in post bodies ([light] uses these too unless it sets its own)
[dark.styles.h1]
fg = "@on_accent"
bg = "@accent"
bold = true

[dark.styles.h2]
bold = true

[dark.styles.h3]
fg = "@accent"
bold = true

[dark.styles.h4]
bold = true
italic = true

[dark.styles.h5]
fg = "@muted"
bold = true

[dark.styles.h6]
fg = "@muted"
italic = true

[dark.styles.quote]
fg = "@muted"
border = "@accent"
italic = true

[dark.styles.code_block]
border = "@border"

[dark.styles.list_marker]
fg = "@accent"

[dark.styles.task]
fg = "@accent"
bold = true

[dark.styles.table]
border = "@border"

[dark.styles.table_header]
fg = "@accent"
bold = true

[dark.styles.rule]
fg = "@muted"

[dark.styles.footnote]
fg = "@muted"

[light.palette]
accent = "#c0392b"
muted = "#5f6366"
border = "#a3a5a8"
on_accent = "#ffffff"
fg = "#2b2d2f"
bg = "#e4e4e0"

[light.styles.card_focused]
border = "@accent"

[light.styles.dialog]
bg = "@bg"

[light.styles.post_tag]
fg = "@bg"
bg = "@fg"
