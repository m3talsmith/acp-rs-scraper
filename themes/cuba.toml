# acp-red-star theme, format v1. See docs/USAGE.md (Themes).
version = 1
name = "cuba"
description = "Cuban revolutionary: olive green fatigues, red and black"

[dark.palette]
accent = "#d32f2f"
muted = "#a3ad6f"
border = "#556b2f"
on_accent = "#ffffff"
fg = "#e9e4d0"
bg = "#1b1f14"
olive = "#a3ad6f"

[dark.styles.post_tag]
bg = "@border"

[dark.styles.code]
fg = "@olive"

[dark.styles.dialog]
bg = "@bg"

# Markdown in post bodies ([light] uses these too unless it sets its own)
[dark.styles.h1]
fg = "@on_accent"
bg = "@accent"
bold = true

[dark.styles.h2]
bold = true

[dark.styles.h3]
fg = "@olive"
bold = true

[dark.styles.h4]
bold = true
italic = true

[dark.styles.h5]
fg = "@muted"
bold = true

[dark.styles.h6]
fg = "@muted"
italic = true

[dark.styles.quote]
fg = "@muted"
border = "@olive"
italic = true

[dark.styles.code_block]
border = "@border"

[dark.styles.list_marker]
fg = "@accent"

[dark.styles.task]
fg = "@accent"
bold = true

[dark.styles.table]
border = "@olive"

[dark.styles.table_header]
fg = "@accent"
bold = true

[dark.styles.rule]
fg = "@muted"

[dark.styles.footnote]
fg = "@muted"

[light.palette]
accent = "#b71c1c"
muted = "#4b5320"
border = "#6b8e23"
on_accent = "#ffffff"
fg = "#1b1f14"
bg = "#eef0e2"
olive = "#4b5320"

[light.styles.post_tag]
bg = "@border"

[light.styles.code]
fg = "@olive"

[light.styles.dialog]
bg = "@bg"
