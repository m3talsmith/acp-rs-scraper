# acp-red-star theme, format v1. See docs/USAGE.md (Themes).
version = 1
name = "red-star"
description = "ACP Red Star brand: ink black, vermilion and gold, cream text, from the banner"

[dark.palette]
accent = "#c8102e"
muted = "#e8b648"
border = "#a20b19"
on_accent = "#f6e8c8"
fg = "#f6e8c8"
bg = "#0e0404"
yellow = "#e8b648"

[dark.styles.bold]
fg = "@yellow"

[dark.styles.bar]
bold = true

[dark.styles.dialog]
bg = "@bg"

# Markdown in post bodies ([light] uses these too unless it sets its own)
[dark.styles.h1]
fg = "@on_accent"
bg = "@accent"
bold = true

[dark.styles.h2]
bold = true

[dark.styles.h3]
fg = "@yellow"
bold = true

[dark.styles.h4]
bold = true
italic = true

[dark.styles.h5]
fg = "@muted"
bold = true

[dark.styles.h6]
fg = "@muted"
italic = true

[dark.styles.quote]
fg = "@muted"
border = "@yellow"
italic = true

[dark.styles.code_block]
border = "@border"

[dark.styles.list_marker]
fg = "@accent"

[dark.styles.task]
fg = "@accent"
bold = true

[dark.styles.table]
border = "@border"

[dark.styles.table_header]
fg = "@yellow"
bold = true

[dark.styles.rule]
fg = "@muted"

[dark.styles.footnote]
fg = "@muted"

[light.palette]
accent = "#c8102e"
muted = "#825f10"
border = "#5c060e"
on_accent = "#f6e8c8"
fg = "#0e0404"
bg = "#f6e8c8"
yellow = "#825f10"

[light.styles.bold]
fg = "@yellow"

[light.styles.bar]
bold = true

[light.styles.dialog]
bg = "@bg"

[light.styles.post_tag]
fg = "@bg"
bg = "@fg"
