# acp-red-star theme, format v1. See docs/USAGE.md (Themes).
# Rebel Hold watercolor. Dark grounds are night #04121a, the header is the
# deeper #03090f, and panels sit in #0b2a33. Text is #bfe9e1, bold is #e6fbf7.
# The mark runs #2fb49a to #2a86b8. Light is paper #f7f5ef and ink #0d3b4a,
# with the mark running #1f9a7e to #1b6f9a. Body text is at least 4.5:1.
# Borders and the light mark's teal end are at least 3:1.
version = 1
name = "red-star"
description = "Rebel Hold watercolor: teal and blue on night, paper and ink in the light"

[dark.palette]
accent = "#2fb49a"
muted = "#339e90"
border = "#288e95"
on_accent = "#03090f"
fg = "#bfe9e1"
bg = "#04121a"
bright = "#e6fbf7"
deep = "#03090f"
surface = "#0b2a33"
raised = "#123c47"
aqua = "#4ca6a5"
link = "#2a86b8"
chip = "#1c6f93"
mark = "#2fb49a"
mark_end = "#2a86b8"
danger = "#c67b6d"

[dark.styles.bold]
fg = "@bright"

[dark.styles.link]
fg = "@link"
underline = true

[dark.styles.gone]
fg = "@muted"

[dark.styles.code]
fg = "@aqua"
bg = "@surface"

[dark.styles.selected]
fg = "@bright"
bg = "@chip"
bold = true

[dark.styles.field]
fg = "@bright"
bg = "@surface"
underline = true

[dark.styles.bar]
fg = "@bright"
bg = "@deep"
bold = true

[dark.styles.button]
fg = "@on_accent"
bg = "@accent"
bold = true

[dark.styles.post_tag]
fg = "@bright"
bg = "@chip"
bold = true

[dark.styles.reply_tag]
fg = "@on_accent"
bg = "@accent"
bold = true

[dark.styles.dialog]
bg = "@surface"
border = "@border"

# Markdown in post bodies ([light] uses these too unless it sets its own)
[dark.styles.h1]
fg = "@on_accent"
bg = "@accent"
bold = true

[dark.styles.h2]
bold = true

[dark.styles.h3]
fg = "@aqua"
bold = true

[dark.styles.h4]
bold = true
italic = true

[dark.styles.h5]
fg = "@muted"
bold = true

[dark.styles.h6]
fg = "@muted"
italic = true

[dark.styles.quote]
fg = "@muted"
border = "@link"
italic = true

[dark.styles.code_block]
border = "@border"

[dark.styles.list_marker]
fg = "@accent"

[dark.styles.task]
fg = "@accent"
bold = true

[dark.styles.table]
border = "@border"

[dark.styles.table_header]
fg = "@aqua"
bold = true

[dark.styles.rule]
fg = "@muted"

[dark.styles.footnote]
fg = "@muted"

[light.palette]
accent = "#1b6f9a"
muted = "#1c6f93"
border = "#1f9a7e"
on_accent = "#f7f5ef"
fg = "#0d3b4a"
bg = "#f7f5ef"
bright = "#04121a"
deep = "#e7f4f1"
surface = "#e7f4f1"
raised = "#d7ebe6"
aqua = "#1b6f9a"
link = "#1b6f9a"
chip = "#d7ebe6"
mark = "#1f9a7e"
mark_end = "#1b6f9a"
danger = "#9f5450"

[light.styles.bold]
fg = "@bright"

[light.styles.code]
fg = "@accent"
bg = "@surface"

[light.styles.selected]
fg = "@fg"
bg = "@raised"
bold = true

[light.styles.field]
fg = "@fg"
bg = "@surface"
underline = true

[light.styles.bar]
fg = "@fg"
bg = "@deep"
bold = true

[light.styles.button]
fg = "@on_accent"
bg = "@accent"
bold = true

[light.styles.h1]
fg = "@on_accent"
bg = "@accent"
bold = true

[light.styles.h3]
fg = "@accent"
bold = true

[light.styles.dialog]
bg = "@bg"

[light.styles.post_tag]
fg = "@on_accent"
bg = "@accent"
bold = true
