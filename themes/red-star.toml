# acp-red-star theme, format v1. See docs/USAGE.md (Themes).
version = 1
name = "red-star"
description = "Red Star: deep crimson with ACP red as the accent"

[dark.palette]
accent = "#dc2626"
muted = "#c98a8a"
border = "#7f1d1d"
on_accent = "#ffffff"
fg = "#f5e9e9"
bg = "#2a0710"

[dark.styles.bar]
bold = true

[dark.styles.dialog]
bg = "@bg"

# Markdown in post bodies ([light] uses these too unless it sets its own)
[dark.styles.h1]
fg = "@on_accent"
bg = "@accent"
bold = true

[dark.styles.h2]
bold = true

[dark.styles.h3]
fg = "@accent"
bold = true

[dark.styles.h4]
bold = true
italic = true

[dark.styles.h5]
fg = "@muted"
bold = true

[dark.styles.h6]
fg = "@muted"
italic = true

[dark.styles.quote]
fg = "@muted"
border = "@accent"
italic = true

[dark.styles.code_block]
border = "@border"

[dark.styles.list_marker]
fg = "@accent"

[dark.styles.task]
fg = "@accent"
bold = true

[dark.styles.table]
border = "@border"

[dark.styles.table_header]
fg = "@accent"
bold = true

[dark.styles.rule]
fg = "@muted"

[dark.styles.footnote]
fg = "@muted"

[light.palette]
accent = "#dc2626"
muted = "#8b3a3a"
border = "#e8b4b4"
on_accent = "#ffffff"
fg = "#3b0a12"
bg = "#fff5f5"

[light.styles.bar]
bold = true

[light.styles.dialog]
bg = "@bg"

[light.styles.post_tag]
fg = "@bg"
bg = "@fg"
