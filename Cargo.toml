[workspace]
members = [".", "crates/acp_red_star_node_core", "crates/acp_red_star_service_redstar", "crates/acp_red_star_service_x"]
resolver = "2"

[package]
name = "acp-red-star"
version = "3.54.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["m3talsmith <m3talsmith@gmail.com>"]
description = "ACP Red Star, a local client for the Red Star forum"
# GitHub path placeholder. Michael is renaming this repository. One later
# patch replaces <core-repo> in these fields and in the README badges.
# Do not retarget git remotes for that rename.
repository = "https://github.com/m3talsmith/<core-repo>"
homepage = "https://github.com/m3talsmith/<core-repo>"
# documentation = "https://github.com/m3talsmith/<core-repo>/docs"
keywords = ["acp", "rs", "redstar"]
categories = ["command-line-utilities", "web-programming"]
# Poster art stays in the repository. It is not part of the published crate.
exclude = ["assets/wallpapers/"]

[[bin]]
name = "acp-red-star"
path = "src/main.rs"

# Compatibility command through version 3. This is not the repository path.
[[bin]]
name = "acp-rs-scraper"
path = "src/bin/acp-rs-scraper.rs"

[[bin]]
name = "acprs"
path = "src/bin/acprs.rs"

[dependencies]
anyhow = "1"
acp_red_star_node_core = { path = "crates/acp_red_star_node_core" }
acp_red_star_service_redstar = { path = "crates/acp_red_star_service_redstar" }
acp_red_star_service_x = { path = "crates/acp_red_star_service_x" }
libloading = "0.8"
reqwest = { version = "0.12", features = ["cookies", "gzip", "brotli", "deflate", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
scraper = "0.27.0"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
regex = "1"
url = "2"
clap = { version = "4", features = ["derive", "string"] }
tar = "0.4"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tui-big-text = "0.8.10"
ratatui-lipgloss = "1.1.0"
argon2 = "0.5"
blake3 = "1"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
bip39 = "2.2"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
zxcvbn = "3"
data-encoding = "2"
rand = "0.8"
rpassword = "7"
chacha20poly1305 = "0.10"
zstd = "0.13"
ciborium = "0.2"
hpke = { version = "0.12", features = ["std", "x25519"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
cucumber = "0.23.0"
futures-util = "0.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "process"] }

[[test]]
name = "e2e"
harness = false
