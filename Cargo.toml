[package]
name = "acp-rs-scraper"
version = "1.16.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["m3talsmith <m3talsmith@gmail.com>"]
description = "ACP Scraper"
repository = "https://github.com/m3talsmith/acp-rs-scraper"
homepage = "https://github.com/m3talsmith/acp-rs-scraper"
# documentation = "https://github.com/m3talsmith/acp-rs-scraper/docs"
keywords = ["acp", "rs", "redstar"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", features = ["cookies", "gzip", "brotli", "deflate", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
scraper = "0.27.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
regex = "1"
url = "2"
clap = { version = "4", features = ["derive"] }
tar = "0.4"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
cucumber = "0.23.0"
futures-util = "0.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "process"] }

[[test]]
name = "e2e"
harness = false
