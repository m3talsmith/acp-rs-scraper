[workspace]
members = [".", "crates/acp_rs_node_core"]
resolver = "2"

[package]
name = "acp-rs-scraper"
version = "3.3.2"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["m3talsmith <m3talsmith@gmail.com>"]
description = "ACP Scraper"
repository = "https://github.com/m3talsmith/acp-rs-scraper"
homepage = "https://github.com/m3talsmith/acp-rs-scraper"
# documentation = "https://github.com/m3talsmith/acp-rs-scraper/docs"
keywords = ["acp", "rs", "redstar"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
anyhow = "1"
acp_rs_node_core = { path = "crates/acp_rs_node_core" }
reqwest = { version = "0.12", features = ["cookies", "gzip", "brotli", "deflate", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
scraper = "0.27.0"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
regex = "1"
url = "2"
clap = { version = "4", features = ["derive"] }
tar = "0.4"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tui-big-text = "0.8.10"
ratatui-lipgloss = "1.1.0"
argon2 = "0.5"
blake3 = "1"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
bip39 = "2.2"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
zxcvbn = "3"
data-encoding = "2"
rand = "0.8"
rpassword = "7"
chacha20poly1305 = "0.10"
zstd = "0.13"
ciborium = "0.2"
hpke = { version = "0.12", features = ["std", "x25519"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
cucumber = "0.23.0"
futures-util = "0.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "process"] }

[[test]]
name = "e2e"
harness = false
